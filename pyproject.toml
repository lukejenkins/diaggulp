[project]
name = "diaggulp"
version = "2026.11.8.post1"
description = "Low-CPU host-side Qualcomm DIAG capture — arms the log mask and pumps raw HDLC"
license = "Apache-2.0"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Luke Jenkins" }]
keywords = ["diag", "modem", "cellular", "baseband", "lte", "5g", "capture", "hdlc", "pcap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: System :: Hardware",
]
# Hard, import-time dependency: the DIAG transport core (DiagClient + DGE1
# helpers), imported at module scope (diaggulp.py:108 `from diagmunge import …`).
# Inward-only edge: diaggulp -> diagmunge -> diaggrok. Never the reverse.
# A bare PyPI name with a floor at the diagmunge release this package's suite
# was verified against; PyPI rejects direct-URL deps. Release order:
# diaggrok, then diagmunge, must be on PyPI before this package is uploaded.
# zstandard: diaggulp.py imports it at module scope (the .zst container
# reader), so it is a hard dependency, not an extra.
dependencies = [
    "diagmunge>=2026.11.8",
    "zstandard",
]

[project.optional-dependencies]
# diaggulp's own serial reader imports pyserial lazily (diaggulp.py:1641) — only
# the live serial-capture path needs it; TCP/UDP/raw-fd capture is stdlib-only.
# pyserial IS on PyPI, so it stays a bare name.
serial = ["pyserial"]
# Inline `--decode` imports diaggrok lazily (diaggulp.py:1256-1257). Bare
# `pip install diaggulp` gives capture with zero diaggrok on the wheel;
# `pip install diaggulp[decode]` wires the published decoder.
# Floored at the verified diaggrok release, as for diagmunge above.
decode = ["diaggrok>=2026.11.8"]

[project.scripts]
diaggulp = "diaggulp:main"

[tool.pytest.ini_options]
# `pytest -m "not decode"` runs the base suite with diaggrok absent; `-m decode`
# selects the single live-decode test that needs the [decode] extra. Registered
# here (the carve ships no pytest.ini) so neither invocation warns.
markers = [
    "decode: exercises the optional diaggrok `--decode` path (needs diaggulp[decode])",
]

[project.urls]
Homepage = "https://github.com/lukejenkins/diaggulp"
Source = "https://github.com/lukejenkins/diaggulp"
Changelog = "https://github.com/lukejenkins/diaggulp/releases"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

# Single-module package: `diaggulp.py` sits at the repo root beside this file.
[tool.setuptools]
py-modules = ["diaggulp"]
